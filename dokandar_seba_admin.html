:root{--bg:#eef0f8;--top:#ffffff;--card:#ffffff;--text:#1f2430;--muted:#6b7280;--accent:#ff4d5a;--accent2:#ff7a45;--line:#e6e9f2}
body{background:radial-gradient(ellipse at 85% -10%,var(--k-fde6ea-b,#fde6ea) 0,transparent 45%),radial-gradient(ellipse at 0 8%,var(--k-e1e6fb-b,#e1e6fb) 0,transparent 50%),var(--k-f1f2f9-b,#f1f2f9);background-attachment:fixed;color:var(--text)}
.wrap{max-width:1100px}

.heading{color:var(--text)}
.heading::after{content:"";display:block;width:44px;height:4px;border-radius:4px;margin:6px auto 0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.crumb,.muted,.mempty{color:var(--muted)}

/* ===== Responsive touch + mobile sizing update ===== */
:root{--tap-h:44px}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
button,.btn,a.box,.bigbtn,.mi,.chip,.gbtn,.back,.dots{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.btn,.back,.dots{min-height:var(--tap-h)}
.btn.small{min-height:38px;padding:6px 10px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #69a9f5;outline-offset:2px}
button:active,.btn:active,.mi:active,.box:active{transform:scale(.985)}
.wrap{width:100%;padding-left:clamp(10px,3vw,24px);padding-right:clamp(10px,3vw,24px)}
.card{padding:clamp(12px,2.5vw,18px);border-radius:14px}

.row>*{min-width:0}
.ov{align-items:stretch}
.mpanel{width:min(78vw,300px);max-width:88vw;height:100%;height:100dvh;padding:12px 11px calc(12px + env(safe-area-inset-bottom));gap:5px;overflow-y:auto;overscroll-behavior:contain}

.mt{flex:1;min-width:0}

.mt small{font-size:11px}
.ma{font-size:18px;flex:0 0 auto}
.mclose{margin-top:8px;min-height:44px;padding:9px 12px;border-radius:11px;font-size:14px;flex:0 0 auto}
.top{gap:8px;padding:10px clamp(10px,3vw,18px)}

.dots{width:42px;height:42px;flex:0 0 42px}
.back{padding:7px 10px;font-size:13px;white-space:nowrap}
.grid{gap:10px}
.box{min-height:84px;padding:10px 8px;border-radius:13px}
.box .t{font-size:clamp(14px,3.8vw,17px);line-height:1.3}
.box .s{font-size:12px}
.box .d{font-size:11px}

.stat{padding:12px}

.chip{padding:6px 10px;font-size:12px;min-height:36px}
.pmgrid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.pmc{padding:9px 6px;font-size:12px}
.pmc img,.pmi{width:44px;height:44px}
@media(max-width:600px){

let flash = null;

function me(){ return db.users.find(u => u.id === db.session) || null; }
function ensureCodes(){
  let ch = false;
  db.userSeq = db.userSeq || 1000; db.orderSeq = db.orderSeq || 1000;
  db.users.forEach(u => { if (!u.code) { u.code = 'U' + (++db.userSeq); ch = true; } });
  db.orders.slice().sort((a, b) => a.id - b.id).forEach(o => { if (!o.no) { o.no = 'ORD-' + (++db.orderSeq); ch = true; } });
  if (ch) save();
}
function findOrderByNo(v, uid){
  const t = String(v || '').trim().toUpperCase().replace(/^ORD-?/, '').replace(/\D/g, ''); if (!t) return null;
  return db.orders.find(o => String(o.no).replace(/\D/g, '') === t && (uid == null || o.userId === uid)) || null;
}
function ordSummary(o, withUser){
  if (!o) return '';
  const user = db.users.find(x => x.id === o.userId), L = {pending: 'Pending', received: 'Received', completed: 'Completed', rejected: 'Cancelled'};
  return `<div class="osum"><div class="row between"><b>${esc(o.no)} <button type="button" class="btn small" data-c="${esc(o.no)}" onclick="copyText(this.dataset.c)" style="padding:1px 7px">Copy</button> · ${esc(o.title)}</b><span class="opill o-${o.status}">${L[o.status] || esc(o.status)}</span></div>
  <small class="muted">${fmtDT(o.at)} · ${money(o.price)}${withUser && user ? ' · ' + esc(user.name) + ' (' + esc(user.code || '') + ') ' + esc(user.phone) : ''}</small>
  ${Object.entries(o.inputs || {}).map(([k, v]) => `<div class="osl">${esc(k)}: <b>${esc(v)}</b></div>`).join('')}
  ${o.result ? `<div class="osl">Delivery: ${o.result.text ? esc(o.result.text) : ''}${o.result.fileName ? ' 📎 ' + esc(o.result.fileName) : ''}</div>` : ''}${o.note ? `<div class="osl">Note: ${esc(o.note)}</div>` : ''}</div>`;
}
function nextId(){ db.nextId += 1; return db.nextId; }

/* ---------- layout helpers ---------- */
function userTop(title, backUrl, menu){
  const u = me();
  const left = backUrl ? `<a class="back" href="#${backUrl}">← ফিরে যান</a>`
    : (menu ? `<button type="button" class="dots" onclick="toggleMenu()" aria-label="মেনু">⋮</button>` : '<span class="spacer"></span>');
  return `<header class="top">${left}<h1>${esc(title)}</h1><span class="bal">${money(u ? u.balance : 0)}</span></header>`;
}
function userNav(active){
  const items = [['u/history','fa-clock-rotate-left','History'],['u/dash','fa-house','Dashboard'],['u/profile','fa-user','Profile'],['u/recharge','fa-wallet','Recharge']];
  return `<nav class="bottom-nav">${items.map(([h,i,l]) => `<a href="#${h}" class="${h===active?'on':''}"><i class="fa-solid ${i}"></i><span>${l}</span></a>`).join('')}</nav>`;
}
function flashHtml(){ if (!flash) return ''; const m = flash; flash = null; return `<div class="flash">${esc(m)}</div>`; }
function errHtml(m){ return m ? `<div class="error">${esc(m)}</div>` : ''; }
function badge(s){
  const L = {pending:'পেন্ডিং', received:'গ্রহণ', completed:'সম্পন্ন', rejected:'বাতিল', approved:'অনুমোদিত', open:'খোলা', resolved:'সমাধান'};
  return `<span class="badge b-${s}">${L[s] || s}</span>`;
}
function adminTop(title){
  return `<header class="top"><button type="button" class="dots" onclick="toggleMenu()" aria-label="মেনু">⋮</button><h1>${esc(title)}</h1><a class="back" href="#admin-logout">লগআউট</a></header>${adminMenuHtml()}`;

/* ---------- router ---------- */
function route(){
  ensureCodes();
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  return {path: path || 'login', q: Object.fromEntries(new URLSearchParams(qs || ''))};
}
function render(){
  const r = route();
  const app = $('#app');
  const isAdminPath = r.path.startsWith('a/') || r.path === 'admin-login' || r.path === 'admin-logout';
  if (PANEL === 'user' && isAdminPath) { location.hash = '#login'; return; }
  if (PANEL === 'admin' && !isAdminPath) { location.hash = '#admin-login'; return; }
  if (r.path.startsWith('u/') && !db.session) return go('login');
  if (r.path.startsWith('a/') && !db.adminIn) return go('admin-login');
  const views = {
    'login': loginView, 'register': registerView, 'admin-login': () => (db.adminIn ? (location.hash='#a/home', '') : adminLoginView()), 'admin-logout': adminLogout,
    'logout': logoutUser,
    'u/dash': dashView, 'u/folder': folderView, 'u/order': orderView, 'u/history': historyView,
    'u/profile': profileView, 'u/recharge': rechargeView, 'u/geo': geoView, 'u/search': searchPageView,
    'a/home': adminHome, 'a/payments': adminPayments, 'a/autopay': adminPayments, 'a/complaints': adminComplaints, 'a/settings': adminSettings, 'a/rates': adminRates, 'a/bots': adminBots, 'u/complaint': complaintView, 'a/orders': adminOrders, 'a/users': adminUsers, 'a/recharges': adminRecharges, 'a/services': adminFolders, 'a/folders': adminFolders, 'a/add': adminAdd, 'a/api': adminApi, 'u/api': apiView, 'u/apirun': apirunView, 'a/upload': adminUpload, 'a/units': adminUnits
  };
  const fn = views[r.path] || (r.path.startsWith('a/') ? adminHome : (db.session ? dashView : loginView));
  app.innerHTML = fn(r.q) + (r.path.startsWith('a/') ? adminBottom(r.path) : waFab());
  window.scrollTo(0, 0);
}

function doLogin(ev){
  ev.preventDefault();
  const f = new FormData(ev.target);
  const phone = String(f.get('phone')).replace(/\D/g,'');
  const u = db.users.find(x => x.phone === phone && x.password === f.get('password'));
  if (!u) { setFlash('মোবাইল বা পাসওয়ার্ড ভুল।'); return render(), false; }
  if (!u.active) { setFlash('অ্যাকাউন্ট বন্ধ আছে।'); return render(), false; }
  db.session = u.id; popupShow = true; save(); go('u/dash'); return false;
}
function registerView(){
  return `<div class="auth"><h1>দোকানদার সেবা</h1><div class="card"><h2 class="center">নতুন অ্যাকাউন্ট</h2>
  <form onsubmit="return doRegister(event)">
    <label>নাম</label><input name="name" required maxlength="120">
    <label>মোবাইল নম্বর</label><input name="phone" required inputmode="numeric" placeholder="01XXXXXXXXX">
    <label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input type="password" name="password" required minlength="6">

}
function doRegister(ev){
  ev.preventDefault();
  const f = new FormData(ev.target);
  const phone = String(f.get('phone')).replace(/\D/g,'');
  if (!/^01[3-9]\d{8}$/.test(phone)) { setFlash('সঠিক মোবাইল নম্বর দিন।'); return render(), false; }
  if (db.users.some(x => x.phone === phone)) { setFlash('এই নম্বরে আগে থেকেই অ্যাকাউন্ট আছে।'); return render(), false; }
  const u = {id: nextId(), name: String(f.get('name')).slice(0,120), phone, password: String(f.get('password')), balance: 0, active: true};
  u.code = 'U' + ((db.userSeq = (db.userSeq || 1000) + 1));
  db.users.push(u); db.session = u.id; popupShow = true; save(); setFlash('অ্যাকাউন্ট তৈরি হয়েছে।'); go('u/dash'); return false;
}

function orderHistHtml(svc){
  const u = me(); const cut = Date.now() - HOURS * 3600e3;
  const cat = svc.folder || 'অন্যান্য';
  const list = db.orders.filter(o => o.userId === u.id && (o.folder || 'অন্যান্য') === cat && new Date(o.at).getTime() >= cut).slice().reverse();
  let h = `<div class="card" style="padding:0;overflow:hidden;margin-top:14px"><div class="row between" style="padding:12px 16px;background:#1d4f91"><b>সাম্প্রতিক ${esc(cat)} অর্ডার</b></div>`;
  if (!list.length) return h + '<div class="note" style="margin:12px">এখনো কোনো অর্ডার নেই।</div></div>';
  h += '<div class="table-wrap"><table class="ptable"><tr><th>অর্ডার</th><th>তথ্য</th><th>অবস্থা</th><th>সময়</th></tr>';
  list.forEach(o => {
    const info = Object.entries(o.inputs || {}).map(([k, v]) => `${esc(k)}: <b>${esc(v)}</b>`).join('<br>');
    h += `<tr><td>${esc(o.no || '')}<br><small>${esc(o.title)}</small></td><td>${info}</td><td>${badge(o.status)}${o.link ? `<br><a class="btn small" href="#${esc(o.link)}">দেখুন</a>` : ''}</td><td><small>${new Date(o.at).toLocaleString('bn-BD')}</small></td></tr>`;
  });
  return h + '</table></div></div>';
}
function orderView(q){
  const svc = db.services.find(x => x.id === Number(q.id) && x.active);

function doOrder(ev, id){
  ev.preventDefault();
  const svc = db.services.find(x => x.id === id);
  const u = me();
  const f = new FormData(ev.target);
  const inputs = {};
  svc.fields.forEach((label, i) => inputs[label] = String(f.get('f' + i)).trim().slice(0, 200));
  if (!db.serverOn) { go('u/order?id=' + id + '&err=' + encodeURIComponent('সার্ভার বন্ধ আছে।')); return false; }
  if (u.balance < uPrice(svc.price, svc)) { go('u/order?id=' + id + '&err=' + encodeURIComponent('ব্যালেন্স যথেষ্ট নেই। আগে রিচার্জ করুন।')); return false; }
  u.balance -= uPrice(svc.price, svc);
  db.orders.push({id: nextId(), userId: u.id, title: svc.title, folder: svc.folder, price: uPrice(svc.price, svc), inputs, status: 'pending', note: '', at: nowIso()});
  tgSend('🛒 নতুন অর্ডার: ' + svc.title + ' · ' + u.phone);
  save(); setFlash('অর্ডার জমা হয়েছে।'); go('u/history'); return false;
}
function histCard(o){
  let h = `<div class="card"><div class="row between"><strong>${esc(o.title)}</strong>${badge(o.status)}</div>
      <p style="margin:4px 0"><span class="badge b-received">Order No: ${esc(o.no || '')}</span> <button type="button" class="btn small" data-c="${esc(o.no || '')}" onclick="copyText(this.dataset.c)">Copy</button></p>
      <p class="muted" style="margin:6px 0">${money(o.price)}</p>`;
  Object.entries(o.inputs || {}).forEach(([k, v]) => h += `<div>${esc(k)}: <b>${esc(v)}</b></div>`);
  if (o.note) h += `<div class="note">অ্যাডমিন নোট: ${esc(o.note)}</div>`;
  if (o.result) h += `<div class="note" style="text-align:left">📦 ডেলিভারি: ${o.result.text ? esc(o.result.text) : ''}${o.result.fileData ? ` <a class="btn primary small" href="${o.result.fileData}" download="${esc(o.result.fileName)}">⬇ ${esc(o.result.fileName)}</a>` : ''}</div>`;
  if (o.link) h += `<p style="margin:8px 0 0"><a class="btn small" href="#${esc(o.link)}">ফলাফল / PDF দেখুন</a></p>`;
  return h + `<p class="muted" style="font-size:12px">${new Date(o.at).toLocaleString('bn-BD')}</p></div>`;
}
function historyView(q){
  const u = me(); const cut = Date.now() - HOURS * 3600e3;
  const list = db.orders.filter(o => o.userId === u.id && new Date(o.at).getTime() >= cut).slice().reverse();
  const catOf = o => o.folder || 'অন্যান্য';
  let h = userTop('History') + `<main class="wrap"><p class="crumb">গত ${bn(HOURS)} ঘণ্টার অর্ডার · ক্যাটাগরি অনুযায়ী</p>${flashHtml()}`;
  if (!list.length) return h + '<div class="note">কোনো অর্ডার নেই।</div></main>' + userNav('u/history');
  const cats = [...new Set(list.map(catOf))];
  const cur = q && q.c && cats.includes(q.c) ? q.c : '';
  const shown = cur ? list.filter(o => catOf(o) === cur) : list;
  const tab = (href, label, n, on) => `<a href="${href}" style="flex:0 0 auto;text-decoration:none;padding:8px 14px;border-radius:20px;border:1px solid ${on ? '#ef4444' : '#3c5474'};background:${on ? '#ef4444' : 'var(--card)'};color:${on ? '#fff' : 'var(--text)'};font-weight:600;white-space:nowrap">${label} <span style="opacity:.85">${bn(n)}</span></a>`;
  h += '<div style="display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px">' + tab('#u/history', 'সব', list.length, !cur) +
    cats.map(c => tab('#u/history?c=' + encodeURIComponent(c), esc(c), list.filter(o => catOf(o) === c).length, cur === c)).join('') + '</div>';
  if (cur) h += `<h3 style="margin:4px 0 10px">📁 ${esc(cur)}</h3>`;
  shown.forEach(o => h += histCard(o));
  return h + '</main>' + userNav('u/history');
}

function pfToggle(id){ ['pfPw', 'pfEdit'].forEach(x => { const e = document.getElementById(x); if (e) e.hidden = x === id ? !e.hidden : true; }); const t = document.getElementById(id); if (t && !t.hidden) t.scrollIntoView({behavior: 'smooth', block: 'center'}); }
function setAvatar(inp){
  const file = inp.files && inp.files[0], u = me(); if (!file || !u) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {

function balToast(m, bad){

  t.textContent = m; t.className = 'bal-toast show' + (bad ? ' bad' : '');

function walletAdj(id, dir){
  const u = db.users.find(x => x.id === id), el = document.getElementById('wa-' + id), amt = Math.abs(Number(el && el.value) || 0);
  if (!u) return;
  if (!amt) { balToast('টাকার পরিমাণ লিখুন (যেমন 20)', true); if (el) el.focus(); return; }
  const nb = Math.round((Number(u.balance || 0) + dir * amt) * 100) / 100;
  if (nb < 0) { balToast('ব্যালেন্স মাইনাসে যাবে না।', true); return; }
  u.balance = nb; save();
  const b = document.getElementById('bal-' + id); if (b) b.textContent = money(nb);
  const h = document.getElementById('balh-' + id); if (h) h.textContent = money(nb);
  if (el) el.value = '';
  balToast('ব্যালেন্স ' + (dir > 0 ? '＋' : '−') + money(amt).replace(CURRENCY, '') + '৳ — এখন ' + money(nb));
}

function rateAdjOf(u, w){ return Number(u.rates && u.rates[w.o.id]) || 0; }
function rateEff(base, adj){ const b = Number(base) || 0; return b > 0 && adj ? Math.max(0, Math.round((b + adj) * 100) / 100) : b; }
function rateRowHtml(u, w){
  const adj = rateAdjOf(u, w), id = w.o.id, base = Number(w.o.price) || 0;
  return `<div class="rl-row" id="rl-${u.id}-${id}"><div class="rl-name"><b>${esc(w.n)}</b><small>মূল ${money(base)}</small></div>
    <div class="rl-price"><b id="rlp-${u.id}-${id}">${money(rateEff(base, adj))}</b><small id="rla-${u.id}-${id}" class="${adj > 0 ? 'up' : adj < 0 ? 'down' : ''}">${adj > 0 ? '+' : ''}${adj}৳</small></div>
    <div class="rl-ctl"><button type="button" class="bal-btn minus sm" aria-label="রেট কমান" onclick="rateStep(${u.id},${id},-1)">−</button><button type="button" class="bal-btn plus sm" aria-label="রেট বাড়ান" onclick="rateStep(${u.id},${id},1)">+</button></div></div>`;
}
function rateListHtml(u){
  const ws = worksList();
  if (Number(u.rateAdj)) { u.rates = u.rates || {}; ws.forEach(w => { u.rates[w.o.id] = Math.round(((Number(u.rates[w.o.id]) || 0) + Number(u.rateAdj)) * 100) / 100; }); u.rateAdj = 0; save(); }
  if (!ws.length) return '<div class="muted" style="padding:6px 2px">এখনো কোনো কাজ বা সার্ভিস তৈরি করা হয়নি।</div>';
  return `<div class="rl-top"><div class="ap-title" style="margin:0">কাজের রেট তালিকা (${bn(ws.length)}টি)</div>
    <div class="rl-step"><label for="rstep-${u.id}">প্রতি ক্লিকে</label><input id="rstep-${u.id}" type="number" min="0.01" step="0.01" inputmode="decimal" value="5"><span>৳</span><button type="button" class="ap-reset" onclick="rateResetAll(${u.id})">সব রিসেট</button></div></div>
    <div class="rl-list">${ws.map(w => rateRowHtml(u, w)).join('')}</div>`;
}
function rateStep(uid, wid, dir){
  const u = db.users.find(x => x.id === uid), w = worksList().find(x => x.o.id === wid); if (!u || !w) return;
  const el = document.getElementById('rstep-' + uid), step = Math.abs(Number(el && el.value) || 0);
  if (!step) { balToast('কত টাকা করে বদলাবে তা লিখুন', true); if (el) el.focus(); return; }
  const base = Number(w.o.price) || 0; u.rates = u.rates || {};
  let adj = Math.round((rateAdjOf(u, w) + dir * step) * 100) / 100;
  if (base + adj < 0) adj = -base;
  if (adj) u.rates[wid] = adj; else delete u.rates[wid];
  save();
  const p = document.getElementById('rlp-' + uid + '-' + wid), a = document.getElementById('rla-' + uid + '-' + wid);
  if (p) p.textContent = money(rateEff(base, adj));
  if (a) { a.textContent = (adj > 0 ? '+' : '') + adj + '৳'; a.className = adj > 0 ? 'up' : adj < 0 ? 'down' : ''; }
}
function rateResetAll(uid){

  u.rates = {}; u.rateAdj = 0; save(); const p = document.getElementById('ap-rate-' + uid); if (p) p.innerHTML = rateListHtml(u); balToast('সব রেট রিসেট হয়েছে');

function hasTpl(it){ return !!(it && it.pdfTemplate && it.zones && it.zones.length); }
function zoneValue(key, flat, input){
  key = String(key || '').trim(); if (!key) return '';
  if (key.charAt(0) === '=') return key.slice(1);
  if (key === '@today') return new Date().toISOString().slice(0, 10);
  if (key.startsWith('input.')) { const v = (input || {})[key.slice(6)]; return v === undefined ? '' : String(v); }
  if (flat[key] !== undefined && flat[key] !== null) return String(flat[key]);
  const lk = key.toLowerCase();
  const k = Object.keys(flat).find(x => x.toLowerCase() === lk || x.toLowerCase().endsWith('.' + lk));
  return k && flat[k] !== null && flat[k] !== undefined ? String(flat[k]) : '';
}
async function buildFilledPdf(tpl, zones, data, input){
  await pdfLibs();
  try { await document.fonts.load("16px 'Hind Siliguri'"); } catch (e) {}
  const src = await pdfjsLib.getDocument({data: dataUrlBytes(tpl)}).promise;
  const out = await PDFLib.PDFDocument.create();
  const flat = flatVals(data || {}), S = 2.5;
  const fam = "'Hind Siliguri', Arial, sans-serif";
  for (let n = 1; n <= src.numPages; n++) {
    const page = await src.getPage(n), b = page.getViewport({scale: 1}), vp = page.getViewport({scale: S});
    const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    const ctx = cv.getContext('2d');
    await page.render({canvasContext: ctx, viewport: vp}).promise;
    for (const z of zones.filter(z => z.page === n)) {
      const X = z.x * cv.width, Y = z.y * cv.height, W = z.w * cv.width, H = z.h * cv.height;
      ctx.fillStyle = '#ffffff'; ctx.fillRect(X - 1, Y - 1, W + 2, H + 2);
      if (z.type === 'erase') continue;
      const val = zoneValue(z.key, flat, input);
      if (!val) continue;
      if (z.type === 'qr') {
        try { const img = await loadImg(val.startsWith('data:') ? val : 'data:image/png;base64,' + val); const sz = Math.min(W, H); ctx.drawImage(img, X + (W - sz) / 2, Y + (H - sz) / 2, sz, sz); } catch (e) {}
        continue;
      }
      let px = (Number(z.size) || 12) * S;
      const wt = z.bold ? '700 ' : '400 ';
      ctx.fillStyle = z.color || '#000000'; ctx.textBaseline = 'middle'; ctx.textAlign = z.align || 'left';
      ctx.font = wt + px + 'px ' + fam;
      while (ctx.measureText(val).width > W - 4 && px > 6) { px -= 1; ctx.font = wt + px + 'px ' + fam; }
      const tx = z.align === 'center' ? X + W / 2 : z.align === 'right' ? X + W - 2 : X + 2;
      ctx.fillText(val, tx, Y + H / 2);
    }
    const jpg = await out.embedJpg(cv.toDataURL('image/jpeg', 0.92));
    const pg = out.addPage([b.width, b.height]);
    pg.drawImage(jpg, {x: 0, y: 0, width: b.width, height: b.height});
  }

}

async function zedLoadPage(){

    ZED.num = ZED.doc.numPages;

    const page = await ZED.doc.getPage(ZED.page), base = page.getViewport({scale: 1}), vp = page.getViewport({scale: 900 / base.width});

function buildCurl(it){
  const vals = {};
  (it.params || []).forEach(p => vals[p.key] = p.src === 'user' ? 'YOUR_' + String(p.key).toUpperCase() : p.val);
  const sub = s => String(s).replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => (vals[k] !== undefined ? vals[k] : m));
  let url = sub(it.url || 'https://api.example.com/endpoint');
  const hdr = [], q = Object.assign({}, vals), method = it.method || 'GET';
  if (it.apiKey || it.keyMode === 'xkey' || it.keyMode === 'query') {
    if (it.keyMode === 'xkey') hdr.push('-H "X-API-Key: YOUR_API_KEY"');
    else if (it.keyMode === 'query') q[it.keyName || 'api_key'] = 'YOUR_API_KEY';
    else hdr.push('-H "Authorization: Bearer YOUR_API_KEY"');
  }
  if (method === 'GET') {
    const qs = Object.keys(q).map(k => k + '=' + q[k]).join('&');
    if (qs) url += (url.includes('?') ? '&' : '?') + qs;
  } else hdr.push('-H "Content-Type: application/json"');
  return `curl -X ${method} "${url}"` + hdr.map(h => ' \\\n  ' + h).join('') + (method === 'GET' ? '' : ` \\\n  -d '${JSON.stringify(q)}'`);
}

const UNITS = {}, AREAS = {};
GEO.forEach((dv, d) => dv.d.forEach((dist, c) => dist.seats.forEach((st, s) => st.p.forEach((ar, a) => {
  const ak = `${d}-${c}-${s}-${a}`;
  AREAS[ak] = {ak, d, c, s, a, dv, dist, st, ar, staticN: ar.x.length};
  ar.x.forEach((x, u) => { UNITS[`${ak}-${u}`] = {uk: `${ak}-${u}`, ak, u, x, d, c, s, a, dv, dist, st, ar}; });
}))));
const DIGI = {'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};
const asciiD = s => String(s ?? '').replace(/[০-৯]/g, c => DIGI[c]);
function wardsOf(uk){ const U = UNITS[uk]; return (db.wardOv && db.wardOv[uk] != null) ? db.wardOv[uk] : U.x[2]; }
function unitKeysOfArea(ak){ return AREAS[ak].ar.x.map((x, u) => `${ak}-${u}`); }
function areaVoterCount(ak){ return upazilaVoters(ak).length; }
function unitWardVoters(uk, w, g){ return db.voters.filter(v => v.scope === 'unit' && v.unitKey === uk && v.ward === w && (!g || v.gender === g || v.gender === 'x')); }
function voterMatches(list, q){
  const s = (q || '').trim().toLowerCase();

function voterCards(list){

function ubox(i, href, title, sub, detail){

/* ---------- user geo drill-down: বিভাগ > জেলা > আসন > উপজেলা > ইউনিয়ন > ওয়ার্ড > পুরুষ/মহিলা > ভোটার ---------- */
function geoView(q){
  let title = 'ঠিকানা অনুসন্ধান', heading = '', back = 'u/dash', crumbs = [], body = '';
  if (q.uk && UNITS[q.uk]) {
    if (q.w !== undefined) return wardView(q);
    const U = UNITS[q.uk];
    const n = wardsOf(q.uk);
    let items = '';
    for (let w = 1; w <= n; w++) items += ubox(w - 1, `u/geo?uk=${q.uk}&w=${w}`, 'ওয়ার্ড ' + bn(w), '', unitWardVoters(q.uk, w, '').length ? bn(unitWardVoters(q.uk, w, '').length) + ' জন' : '');
    if (db.voters.some(v => v.scope === 'unit' && v.unitKey === q.uk && v.ward === 0)) items += ubox(n, `u/geo?uk=${q.uk}&w=0`, 'ওয়ার্ড ছাড়া তালিকা', '', '');
    return userTop(U.x[1], 'u/geo?ak=' + U.ak) + '<main class="wrap">' + `<p class="crumb">${esc([U.dv.n, U.dist.n, U.st.l, U.ar.n, U.x[1]].join(' › '))}</p>` +
      `<h2 class="heading">${esc(U.x[1] + ' — ওয়ার্ড')}</h2>` + flashHtml() + `<section class="grid">${items}</section><p class="note">ওয়ার্ড সংখ্যা: ${bn(n)}</p></main>` + userNav('u/dash');
  } else if (q.av !== undefined && q.ak && AREAS[q.ak]) {
    const A = AREAS[q.ak];
    return userTop(A.ar.n, 'u/geo?ak=' + q.ak) + '<main class="wrap">' +
      `<p class="crumb">${esc([A.dv.n, A.dist.n, A.st.l, A.ar.n].join(' › '))}</p>` +
      `<h2 class="heading">${esc(A.ar.n + ' — উপজেলা ভোটার তালিকা')}</h2>` + flashHtml() +
      searchPanel('u/geo', {ak: q.ak, av: 1, f: q.f || 'all', q: q.q || ''}, upazilaVoters(q.ak), {gender: false, where: null}) +
      '</main>' + userNav('u/dash');
  } else if (q.ak && AREAS[q.ak]) {
    const A = AREAS[q.ak];
    crumbs = [A.dv.n, A.dist.n, A.st.l, A.ar.n];
    heading = A.ar.n + ' — ইউনিয়ন / সিটি / পৌরসভা'; title = A.ar.n; back = `u/geo?d=${A.d}&c=${A.c}&s=${A.s}`;
    let items = '';
    const units = unitKeysOfArea(q.ak);
    if (!units.length) items += '<div class="note" style="grid-column:1/-1">এই এলাকার তথ্য এখনো যোগ করা হয়নি।</div>';
    units.forEach((uk, i) => {
      const U = UNITS[uk];
      items += ubox(i + 1, `u/geo?uk=${uk}`, U.x[1], {u:'ইউনিয়ন',c:'সিটি করপোরেশন',m:'পৌরসভা'}[U.x[0]], 'ওয়ার্ড সংখ্যা: ' + bn(wardsOf(uk)));
    });
    body = searchButton(q.ak) + `<section class="grid">${items}</section>`;
  } else if (q.s !== undefined && q.d !== undefined && q.c !== undefined) {
    const dv = GEO[q.d], dist = dv.d[q.c], st = dist.seats[q.s];
    crumbs = [dv.n, dist.n, st.l];
    heading = 'আসন ' + bn(st.no) + ' — উপজেলা / এলাকা'; title = st.l; back = `u/geo?d=${q.d}&c=${q.c}`;
    body = '<section class="grid">' + st.p.map((ar, a) => {
      const ak = `${q.d}-${q.c}-${q.s}-${a}`;
      const n = unitKeysOfArea(ak).length;
      return ubox(a, `u/geo?ak=${ak}`, ar.n, '', n ? bn(n) + ' টি ইউনিট' : 'তথ্য এখনো যোগ হয়নি');
    }).join('') + '</section>';
  } else if (q.c !== undefined && q.d !== undefined) {
    const dv = GEO[q.d], dist = dv.d[q.c];
    crumbs = [dv.n, dist.n]; heading = dist.n + ' জেলা — আসন'; title = dist.n; back = `u/geo?d=${q.d}`;
    body = '<section class="grid">' + dist.seats.map((st, s) => ubox(s, `u/geo?d=${q.d}&c=${q.c}&s=${s}`, st.l, 'আসন ' + bn(st.no) + (st.f ? ' *' : ''), esc(st.p.map(x => x.n).join(', ') || 'তথ্য নেই'))).join('') + '</section>';
  } else if (q.d !== undefined) {
    const dv = GEO[q.d];
    crumbs = [dv.n]; heading = dv.n + ' বিভাগ — জেলা'; title = dv.n; back = 'u/dash';
    body = '<section class="grid nogo">' + dv.d.map((z, c) => ubox(c, `u/geo?d=${q.d}&c=${c}`, z.n, 'আসন ' + bn(z.seats.length), '')).join('') + '</section>';
  } else {
    heading = 'বিভাগ নির্বাচন করুন';
    body = '<section class="grid nogo">' + GEO.map((dv, d) => ubox(d, `u/geo?d=${d}`, dv.n, '', '')).join('') + '</section>';
  }
  return userTop(title, back) + '<main class="wrap">' + (crumbs.length ? `<p class="crumb">${esc(crumbs.join(' › '))}</p>` : '') +
    `<h2 class="heading">${esc(heading)}</h2>` + flashHtml() + body + '</main>' + userNav('u/dash');
}

function hashOf(path, obj){
  const p = new URLSearchParams();
  Object.entries(obj).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== '' && v !== false) p.set(k, String(v)); });
  const s = p.toString();
  return path + (s ? '?' + s : '');
}
function fieldMatch(v, f, term){
  const t = (term || '').trim().toLowerCase();
  if (!t) return true;
  const keys = f === 'all' ? ['name','father','mother','voter','address'] : [f];
  return keys.some(k => String(v[k] ?? '').toLowerCase().includes(t));

function parseCsvLine(line){
  const out = []; let cur = '', quoted = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (quoted) { if (ch === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else quoted = false; } else cur += ch; }
    else if (ch === '"') quoted = true;
    else if (ch === ',') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur); return out;
}
async function readRows(file){
  const name = file.name.toLowerCase();
  if (name.endsWith('.pdf')) throw new Error('PDF এখনো সমর্থিত নয়। Excel বা CSV/TXT দিন।');
  if (name.endsWith('.xlsx')) {
    if (typeof XLSX === 'undefined') throw new Error('Excel পড়ার লাইব্রেরি লোড হয়নি (ইন্টারনেট দেখুন)। CSV/TXT দিন।');
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: ''});
  }
  if (!/\.(csv|txt)$/.test(name)) throw new Error('শুধু .xlsx, .csv বা .txt দিন।');
  const text = (await file.text()).replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const useTab = (lines[0] || '').split('\t').length > (lines[0] || '').split(',').length;
  return lines.map(l => useTab ? l.split('\t') : parseCsvLine(l));
}
function genderOf(s){ const t = String(s || '').toLowerCase(); if (/মহিলা|নারী|female|^f$/.test(t)) return 'f'; if (/পুরুষ|male|^m$/.test(t)) return 'm'; return 'x'; }
function mapHeader(cells){
  const m = {};
  cells.forEach((c, i) => {
    const t = String(c ?? '').trim().toLowerCase(); if (!t) return;
    if (/পিতা|father/.test(t)) m.father = i;
    else if (/মাতা|mother/.test(t)) m.mother = i;
    else if (/ভোটার|voter/.test(t)) m.voter = i;
    else if (/জন্ম|dob|birth/.test(t)) m.dob = i;
    else if (/ঠিকানা|address/.test(t)) m.address = i;
    else if (/ওয়ার্ড|ward/.test(t)) m.ward = i;
    else if (/লিঙ্গ|gender|sex/.test(t)) m.gender = i;
    else if (/সিরিয়াল|serial|ক্রম/.test(t)) m.serial = i;
    else if (/ইউনিয়ন|পৌরসভা|সিটি|union/.test(t)) m.union = i;
    else if (/নাম|name/.test(t)) m.name = i;
  });
  return m.name !== undefined ? m : null;
}
function voterRecords(rows){
  let start = 0, map = null;
  for (let i = 0; i < Math.min(5, rows.length); i++) { const m = mapHeader(rows[i]); if (m) { map = m; start = i + 1; break; } }
  if (!map) map = {serial: 0, voter: 1, name: 2, father: 3, mother: 4, dob: 5};
  const g = (r, k) => map[k] === undefined ? '' : String(r[map[k]] ?? '').trim();
  return rows.slice(start).map(r => ({
    serial: asciiD(g(r, 'serial')), voter_no: asciiD(g(r, 'voter')), name: g(r, 'name'),
    father: g(r, 'father'), mother: g(r, 'mother'), dob: asciiD(g(r, 'dob')),
    ward: Math.max(0, Math.min(200, parseInt(asciiD(g(r, 'ward')) || '0', 10) || 0)),
    address: g(r, 'address'),
    union: g(r, 'union'),
    gender: genderOf(g(r, 'gender'))
  })).filter(x => x.name);
}
function saveList(kind, t, file, recs){
  const same = u => u.kind === kind && (kind === 'area' ? u.areaKey === t.areaKey
                 : kind === 'union' ? u.unitKey === t.unitKey
                 : (u.unitKey === t.unitKey && u.ward === t.ward && u.gender === t.gender));
  const removed = new Set(db.uploads.filter(same).map(u => u.id));
  db.uploads = db.uploads.filter(u => !removed.has(u.id));
  db.voters = db.voters.filter(v => !removed.has(v.up));
  const id = nextId();
  db.uploads.push({id, kind, areaKey: kind === 'area' ? t.areaKey : null, unitKey: kind === 'area' ? null : t.unitKey,
    ward: kind === 'ward' ? t.ward : 0, gender: kind === 'ward' ? t.gender : 'x', file, count: recs.length});
  recs.forEach(r => db.voters.push({
    up: id, scope: kind === 'area' ? 'area' : 'unit',
    areaKey: kind === 'area' ? t.areaKey : null, unitKey: kind === 'area' ? null : t.unitKey,
    ward: kind === 'ward' ? t.ward : (kind === 'union' ? r.ward : 0),
    gender: kind === 'ward' ? t.gender : (kind === 'union' ? r.gender : 'x'),
    serial: r.serial, voter: r.voter_no, name: r.name, father: r.father, mother: r.mother, dob: r.dob, address: r.address, id: 'v' + Math.random().toString(36).slice(2, 10)
  }));
}
function importStructure(rows){
  let start = 0, c = {area: 1, union: 2, wards: 3};
  for (let i = 0; i < Math.min(5, rows.length); i++) {
    const line = rows[i].join('|');
    if (/উপজেলা|ইউনিয়ন/.test(line) && /ওয়ার্ড/.test(line)) {
      start = i + 1;
      rows[i].forEach((v, idx) => { const t = String(v); if (/উপজেলা/.test(t)) c.area = idx; else if (/ইউনিয়ন|পৌরসভা/.test(t)) c.union = idx; else if (/ওয়ার্ড/.test(t)) c.wards = idx; });
      break;
    }
  }
  let matched = 0; const missing = [];
  rows.slice(start).forEach(r => {
    const area = String(r[c.area] ?? '').trim(), union = String(r[c.union] ?? '').trim();
    const w = parseInt(asciiD(r[c.wards] ?? '0'), 10) || 0;
    if (!union || w < 1 || w > 200) return;
    const hits = Object.values(UNITS).filter(u => u.x[1] === union && (!area || u.ar.n === area || u.ar.n.includes(area)));
    hits.forEach(u => { db.wardOv[u.uk] = w; matched++; });
    if (!hits.length) missing.push(area + ' › ' + union);
  });
  return {matched, missing};
}
async function doUpload(ev, kind){
  ev.preventDefault();
  const f = ev.target, file = f.elements.file.files[0];
  try {
    if (!file) throw new Error('ফাইল বাছাই করুন।');
    const rows = await readRows(file);
    if (kind === 'structure') {
      const r = importStructure(rows);
      setFlash('ওয়ার্ড সংখ্যা আপডেট: ' + r.matched + ' টি ইউনিয়ন।' + (r.missing.length ? ' মেলেনি: ' + r.missing.length + ' টি।' : ''));
    } else {
      const recs = voterRecords(rows);
      if (!recs.length) throw new Error('ফাইলে কোনো ভোটার পাওয়া যায়নি।');
      if (kind === 'area') saveList('area', {areaKey: f.elements.area.value}, file.name, recs);
      if (kind === 'union') saveList('union', {unitKey: f.elements.unit.value}, file.name, recs);
      if (kind === 'ward') {
        const uk = f.elements.unit.value, w = Number(f.elements.ward.value), g = f.elements.gender.value;
        if (w < 1 || w > wardsOf(uk)) throw new Error('সঠিক ওয়ার্ড বাছুন (১ থেকে ' + wardsOf(uk) + ')।');
        saveList('ward', {unitKey: uk, ward: w, gender: g}, file.name, recs);
      }
      setFlash(recs.length + ' জন ভোটার সংরক্ষিত হয়েছে।');
    }
    save();
  } catch (e) { setFlash('ত্রুটি: ' + e.message); }
  render();
  return false;
}
function delUpload(id){
  if (!confirm('এই তালিকা মুছবেন?')) return;
  const ids = new Set([id]);
  db.uploads = db.uploads.filter(u => !ids.has(u.id));
  db.voters = db.voters.filter(v => !ids.has(v.up));

}

/* ---------- আপলোড: অ্যানিমেশন, ফাইলের নাম/ফোল্ডার থেকে ইউনিয়ন মেলানো, ফলাফল ---------- */

}
const busyRow = (done, total, name) => `<div class="uprow"><div class="spin"></div><div><b>আপলোড হচ্ছে… ${bn(done)} / ${bn(total)}</b>

/* ---------- আপলোড v6: আসন-ভিত্তিক, সব শিট, ইউনিয়ন/ওয়ার্ড/পুরুষ-মহিলা অটো ---------- */
function seatUnitKeys(ak){

}

async function readSheets(file){

  if (name.endsWith('.xlsx')) {
    if (typeof XLSX === 'undefined') throw new Error('Excel লাইব্রেরি লোড হয়নি (ইন্টারনেট দেখুন)');
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
    return wb.SheetNames.map(n => ({name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, defval: '', raw: false})}));

    ${failed.length ? `<h3 style="margin:12px 0 4px;color:#ffb3c6">পড়া যায়নি (${bn(failed.length)})</h3>${failed.map(x => line(esc(x))).join('')}` : ''}
    ${pdfs.length ? `<div class="muted" style="margin-top:8px">PDF এই ডেমোতে পড়া যায় না (${bn(pdfs.length)} টি)।</div>` : ''}

}
/* ---------- উপজেলা আপলোড v7: ফাইলের নাম/ফোল্ডার অনুযায়ী ইউনিয়নে, নতুন ইউনিয়ন তৈরি, নামহীন ফাইল → পৌরসভা/সিটি ---------- */

function setPayLogo(id, inp){
  const file = inp.files && inp.files[0], p = db.payments.find(x => x.id === id); if (!file || !p) return;

  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const sc = Math.min(1, 160 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));

    p.logo = c.toDataURL('image/png'); payOpen = 'm' + id; save(); setFlash('Logo saved.'); render();

  <p><button class="btn primary" style="width:100%;margin-top:12px">সেভ করুন</button></p></form></div>

function saveSettings(ev){
  ev.preventDefault(); const f = new FormData(ev.target), s = db.settings;
  s.siteName = String(f.get('siteName')).trim().slice(0, 60) || 'দোকানদার সেবা'; s.notice = String(f.get('notice')).trim().slice(0, 400);
  s.minRecharge = Math.max(1, Number(f.get('minRecharge')) || 50);
  s.popupOn = f.get('popupOn') === 'on'; s.popupTitle = String(f.get('popupTitle') || '').trim().slice(0, 80); s.popupText = String(f.get('popupText') || '').trim().slice(0, 600);
  s.popupLink = String(f.get('popupLink') || '').trim().slice(0, 300); s.popupBtn = String(f.get('popupBtn') || '').trim().slice(0, 40);
  const np = String(f.get('newpass') || ''); if (np) { if (np.length < 6) { setFlash('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর।'); render(); return false; } db.admin.password = np; }
  save(); setFlash('সেটিং সেভ হয়েছে।'); render(); return false;
}
/* ---- সকল কাজের রেট ---- */
function worksList(){
  const a = [];
  db.services.forEach(s => a.push({o: s, n: s.title}));
  db.apis.forEach(x => x.items.forEach(it => a.push({o: it, n: x.name + ' — ' + it.title})));
  return a;
}
function adminRates(){
  const w = worksList();
  return adminTop('সকল কাজের রেট') + `<main class="wrap" style="max-width:720px">${flashHtml()}
  <div class="card"><h3 style="margin:0 0 8px">একসাথে বাড়ান / কমান</h3>
  <div class="row"><input id="rAmt" type="number" min="0" step="0.01" placeholder="পরিমাণ" style="flex:1;min-width:110px"><select id="rMode" style="width:auto"><option value="amt">৳ টাকা</option><option value="pct">% শতাংশ</option></select></div>
  <div class="row" style="margin-top:10px"><button class="btn primary" style="flex:1" onclick="bulkRate(1)">＋ বাড়ান</button><button class="btn danger" style="flex:1" onclick="bulkRate(-1)">− কমান</button></div></div>
  <div class="card"><h3 style="margin:0 0 8px">প্রতিটি কাজের রেট (${bn(w.length)} টি)</h3>
  ${w.length ? w.map((x, k) => `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="flex:1;min-width:150px">${esc(x.n)}</span><input class="rin" data-k="${k}" type="number" min="0" step="0.01" value="${esc(x.o.price || 0)}" style="width:110px"></div>`).join('') + '<button class="btn primary" style="width:100%;margin-top:12px" onclick="saveRates()">সব রেট সেভ করুন</button>' : '<div class="note">কোনো কাজ নেই।</div>'}</div></main>`;
}
function bulkRate(dir){
  const amt = Number(document.getElementById('rAmt').value) || 0; if (!amt) { alert('পরিমাণ দিন।'); return; }
  const pct = document.getElementById('rMode').value === 'pct';
  if (!confirm('সব কাজের রেট ' + (dir > 0 ? 'বাড়াবেন?' : 'কমাবেন?'))) return;
  worksList().forEach(x => { const p = Number(x.o.price) || 0, d = pct ? p * amt / 100 : amt; x.o.price = Math.max(0, Math.round((p + dir * d) * 100) / 100); });
  save(); setFlash('সব কাজের রেট আপডেট হয়েছে।'); render();
}
function saveRates(){
  const w = worksList();
  document.querySelectorAll('.rin').forEach(i => { const x = w[Number(i.dataset.k)]; if (x) x.o.price = Math.max(0, Number(i.value) || 0); });
  save(); setFlash('রেট সেভ হয়েছে।'); render();
}

  <label>শুরুর মেসেজ</label><input name="waMsg" maxlength="200" value="${esc(b.waMsg || '')}" placeholder="হ্যালো, আমার একটি অর্ডার আছে">

  <label>বট টোকেন</label><input name="tgToken" maxlength="120" value="${esc(b.tgToken)}" placeholder="123456:ABC-DEF...">

  <label>Telegram Webhook URL (সার্ভারে সেট করার জন্য)</label><input name="tgWebhook" maxlength="250" value="${esc(b.tgWebhook || '')}" placeholder="https://your-domain.com/webhook/telegram.php">
  <div class="note">⚠️ ডেমোতে Telegram Token-ও ব্রাউজারে থাকে। লাইভ সাইটে সার্ভার-সাইডে রাখতে হবে।</div></div>
  <p class="row"><button class="btn primary" style="flex:1">সেভ করুন</button><button type="button" class="btn" style="flex:1" onclick="tgTest()">টেস্ট মেসেজ</button></p></form></main>`;
}
function saveBots(ev){
  ev.preventDefault(); const f = new FormData(ev.target), b = db.bots;
  b.waOn = !!f.get('waOn'); b.waNumber = String(f.get('waNumber')).trim().slice(0, 20); b.waMsg = String(f.get('waMsg')).trim().slice(0, 200);
  b.waPhoneId = String(f.get('waPhoneId') || '').trim().slice(0, 80); b.waToken = String(f.get('waToken') || '').trim().slice(0, 500); b.waVerify = String(f.get('waVerify') || '').trim().slice(0, 120);
  b.tgOn = !!f.get('tgOn'); b.tgToken = String(f.get('tgToken')).trim().slice(0, 120); b.tgChat = String(f.get('tgChat')).trim().slice(0, 40); b.tgWebhook = String(f.get('tgWebhook') || '').trim().slice(0, 250);
  save(); setFlash('বট সেটিং সেভ হয়েছে।'); render(); return false;
}
function tgTest(){
  const f = document.querySelector('form[onsubmit^="return saveBots"]').elements;
  const tok = f.tgToken.value.trim(), chat = f.tgChat.value.trim();
  if (!tok || !chat) { alert('টোকেন ও চ্যাট আইডি দিন।'); return; }
  fetch('https://api.telegram.org/bot' + encodeURIComponent(tok) + '/sendMessage', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({chat_id: chat, text: '✅ ' + siteName() + ' — টেস্ট মেসেজ'})})
    .then(r => r.json()).then(j => alert(j.ok ? 'টেস্ট মেসেজ গেছে ✅' : 'ব্যর্থ: ' + (j.description || ''))).catch(() => alert('পাঠানো যায়নি (ইন্টারনেট/CORS)।'));
}

/* ---------- boot ---------- */
db = load(); db.voters = db.voters || []; db.uploads = db.uploads || []; db.wardOv = db.wardOv || {}; db.unlocked = db.unlocked || {};

if (!db.autopay) db.autopay = {};
if (!db.payments) db.payments = METHODS.map(m => ({id: nextId(), name: m, number: '', active: true}));
save();
db.extraUnits = db.extraUnits || [];
db.extraUnits.forEach(e => { if (AREAS[e.ak]) addUnitToArea(e.ak, e.name, e.type, e.wards); });
if (!location.hash) location.hash = PANEL === 'admin' ? '#admin-login' : (db.session ? '#u/dash' : '#login');
render();
